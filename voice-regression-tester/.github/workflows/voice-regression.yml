name: Voice Agent Regression Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: voice_regression_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'voice-regression-tester/package-lock.json'

      - name: Install Dependencies
        run: npm ci
        working-directory: ./voice-regression-tester

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./voice-regression-tester

      - name: Push Database Schema
        run: npx prisma db push --skip-generate
        working-directory: ./voice-regression-tester
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/voice_regression_test

      - name: Run Test Suite CLI
        run: npx tsx src/cli.ts
        working-directory: ./voice-regression-tester
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/voice_regression_test
          REDIS_URL: redis://localhost:6379
